name: Generate Android Keystore

# Run this ONCE, manually, before your first Android build.
# Actions tab → "Generate Android Keystore" → "Run workflow".
#
# SECURITY NOTE: workflow_dispatch inputs are visible in the run log to
# anyone with access to this repo. Since this repo is private and you're
# the only collaborator, that's low-risk — but be aware the password you
# type here is briefly visible in this one run's log. Once saved as the
# KEY_STORE_PASSWORD secret afterward, it's properly masked everywhere
# else from that point on.
on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (you will reuse this as the KEY_ALIAS secret)'
        required: true
        default: 'taxfreely'
      password:
        description: 'Keystore password (reused for both store and key password)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=TaxFreely, OU=TaxFreely, O=TaxFreely, L=NA, ST=NA, C=US"

      - name: Base64 encode keystore
        run: base64 -w 0 release.keystore > release.keystore.b64

      # retention-days: 1 — the encoded keystore exists as a downloadable
      # artifact for one day only, then GitHub deletes it automatically.
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-base64
          path: release.keystore.b64
          retention-days: 1
